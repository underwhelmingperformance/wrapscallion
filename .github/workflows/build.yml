name: build

# This is a reusable workflow. GitHub checks a called workflow's permissions
# against the caller as a whole -- the union across its jobs, including ones a
# given call skips -- so every caller grants the full set the jobs declare:
# contents: read to build, packages: write to push, and id-token,
# attestations and artifact-metadata: write to attest the release index.

on:
  workflow_call:
    inputs:
      push:
        description: Push the per-arch images and assemble the multi-arch index.
        required: false
        type: boolean
        default: false
      version:
        description: Release version without the leading v, used for image tags.
        required: false
        type: string
        default: ''
      ref:
        description: Commit to check out and build. Defaults to the caller's ref.
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: The image repository the build pushed to.
        value: ${{ jobs.merge.outputs.image }}
      digest:
        description: The digest of the pushed multi-arch index.
        value: ${{ jobs.merge.outputs.digest }}

permissions: {}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # check out the source to build the image
      packages: write # push the per-arch image by digest when inputs.push
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the source date epoch
        id: epoch
        run: |
          set -euo pipefail

          # The committer time of the commit being built, so rebuilding the
          # same commit reproduces the same image.
          epoch=$(git show -s --format=%ct HEAD)

          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "source date epoch must be a Unix timestamp, got: ${epoch}" >&2
            exit 1
          fi

          echo "value=${epoch}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          echo "image=ghcr.io/${OWNER,,}/wrapscallion" >> "${GITHUB_OUTPUT}"

      - name: Set package version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Bake the release version into the image so it matches the commit the
          # release tag will point at. Nothing in the lock depends on it.
          tmp=$(mktemp)
          jq --tab --arg v "${VERSION}" '.version = $v' deno.json > "${tmp}"
          mv "${tmp}" deno.json

      # Build, load and smoke-test the image. The push step below rebuilds from
      # the same context and hits the buildx cache, so this does not double the
      # work.
      - uses: $/.github/actions/build-image
        with:
          platform: ${{ matrix.platform }}
          source-date-epoch: ${{ steps.epoch.outputs.value }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image for ${{ matrix.platform }}
        id: build
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      - name: Export digest
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read # read the per-arch digest artifacts from this run
      packages: write # push the assembled index
      id-token: write # OIDC for the release-index provenance attestation
      attestations: write # write the release-index provenance attestation
      artifact-metadata: write # record the attested release index
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Resolve image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          echo "image=ghcr.io/${OWNER,,}/wrapscallion" >> "${GITHUB_OUTPUT}"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=pr,enable=${{ inputs.version != '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push the index
        id: assemble
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          tag_list=$(jq -r '.tags[]' <<< "${TAGS_JSON}")
          mapfile -t tags <<< "${tag_list}"
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            "${tags[@]/#/--tag=}" \
            "${sources[@]}"

          echo "tag=${tags[0]}" >> "${GITHUB_OUTPUT}"

      - name: Capture index digest
        id: index
        env:
          TAG: ${{ steps.assemble.outputs.tag }}
        run: |
          set -euo pipefail

          digest=$(docker buildx imagetools inspect "${TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # A release version is set only for release candidates; branch images
      # leave it empty and stay out of the public transparency log.
      - name: Attest the index
        if: ${{ inputs.version != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
